[build-system]
requires = ["setuptools>=59.5.0", "torch==2.4.0+cu121", "ninja", "numpy<2.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pointnet2-cuda"
version = "1.0.0"
description = "PointNet2 CUDA extensions"
requires-python = ">=3.10,<3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["pointnet2_batch", "pointnet2_batch.*"]

[tool.uv.sources]
torch = { index = "pytorch-cuda" }

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu121"
