[build-system]
requires = ["setuptools>=59.5.0", "torch==2.4.0+cu121", "ninja", "numpy<2.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chamfer"
version = "2.0.0"
description = "Chamfer distance CUDA extension"
requires-python = ">=3.10,<3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["chamfer_dist"]

[tool.uv.sources]
torch = { index = "pytorch-cuda" }

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu121"
